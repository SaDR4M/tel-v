# Read-only admin dashboard vhost.
#
# 1. Replace stats.example.com with the real subdomain (DNS A/AAAA -> this VPS).
# 2. Copy to /etc/nginx/sites-available/vpnbot-dashboard and symlink into
#    /etc/nginx/sites-enabled/, then `nginx -t && systemctl reload nginx`.
# 3. Issue the certificate (certbot rewrites this file to add the 443 block):
#      certbot --nginx -d stats.example.com
#
# HTTP Basic auth is enforced by the app itself (DASHBOARD_USERNAME /
# DASHBOARD_PASSWORD in .env), not here.

server {
    listen 80;
    listen [::]:80;
    server_name stats.example.com;

    access_log /var/log/nginx/vpnbot-dashboard.access.log;
    error_log  /var/log/nginx/vpnbot-dashboard.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
